name: Deploy NoviAI Backend to EC2 (Asia Region)

on:
  push:
    branches: ["main"]  # or the branch you want to trigger deployment on

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Build noviai Backend Docker image
      - name: Build noviai Backend Docker image
        run: |
          docker build \
            -t noviai-backend:latest \
            -f backend/Dockerfile \
            backend/

      # Step 3: Save Docker image as tar
      - name: Save Docker image
        run: |
          docker save noviai-backend:latest | gzip > noviai-backend.tar.gz

      # Step 4: Copy image to EC2
      - name: Copy image to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          source: "noviai-backend.tar.gz"
          target: "~/"

      # Step 4.5: Create dynamic .env file and copy to EC2
      - name: Create dynamic .env file
        run: |
          # Create .env file from .env.example with dynamic values
          # Check if .env.example exists in backend directory first, then root
          if [ -f backend/.env.example ]; then
            cp backend/.env.example .env.deploy
          elif [ -f .env.example ]; then
            cp .env.example .env.deploy
          else
            echo "Warning: .env.example not found, creating empty .env.deploy"
            touch .env.deploy
          fi
          
          # Function to safely replace or add environment variables
          update_env_var() {
            local key=$1
            local value=$2
            local file=$3
            
            if grep -q "^${key}=" "$file"; then
              # Use a temporary file to avoid sed issues with special characters
              grep -v "^${key}=" "$file" > "${file}.tmp"
              echo "${key}=${value}" >> "${file}.tmp"
              mv "${file}.tmp" "$file"
            else
              echo "${key}=${value}" >> "$file"
            fi
          }
          
          # Update environment variables using the safe function
          update_env_var "MONGODB_URI" "${{ secrets.MONGODB_URI }}" ".env.deploy"
          update_env_var "FAL_KEY" "${{ secrets.FAL_KEY }}" ".env.deploy"
          update_env_var "GEMINI_KEY" "${{ secrets.GEMINI_KEY }}" ".env.deploy"
          
          # Handle DYNAMIC_ENV_ID if it exists
          if [ -n "${{ secrets.DYNAMIC_ENV_ID }}" ]; then
            update_env_var "DYNAMIC_ENV_ID" "${{ secrets.DYNAMIC_ENV_ID }}" ".env.deploy"
          fi

      # Step 4.6: Prepare nginx configuration with domain name
      - name: Prepare nginx configuration
        run: |
          # Copy nginx template
          cp backend/nginx.conf.template nginx.conf.deploy
          
          # Replace DOMAIN_NAME placeholder with actual domain from secret
          if [ -n "${{ secrets.BACKEND_DOMAIN }}" ]; then
            sed -i "s/DOMAIN_NAME/${{ secrets.BACKEND_DOMAIN }}/g" nginx.conf.deploy
            echo "Configured nginx for domain: ${{ secrets.BACKEND_DOMAIN }}"
          else
            # Use default placeholder if no domain is set
            echo "No BACKEND_DOMAIN secret found, using default configuration"
            sed -i "s/DOMAIN_NAME/_/g" nginx.conf.deploy
          fi
          
          # Copy docker-compose.yml to root for SCP
          cp backend/docker-compose.yml docker-compose.yml.deploy

      - name: Copy configuration files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          source: ".env.deploy,docker-compose.yml.deploy,nginx.conf.deploy"
          target: "~/"

      # Step 5: SSH into EC2 and deploy container
      - name: Deploy on EC2
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }} 
          key: ${{ secrets.EC2_KEY }}
          script: |
            # Remove existing noviai directory
            rm -rf ~/noviai
            # Ensure target directory exists
            mkdir -p ~/noviai

            # Copy configuration files from home directory to noviai directory
            if [ -f ~/.env.deploy ]; then
              cp ~/.env.deploy ~/noviai/.env
              echo "Created .env file from .env.deploy with dynamic DYNAMIC_ENV_ID"
            else
              echo "Error: .env.deploy not found! Cannot create .env file."
              exit 1
            fi

            # Copy docker-compose and nginx config files
            if [ -f ~/docker-compose.yml.deploy ]; then
              cp ~/docker-compose.yml.deploy ~/noviai/docker-compose.yml
              echo "Copied docker-compose.yml"
            elif [ -f ~/docker-compose.yml ]; then
              cp ~/docker-compose.yml ~/noviai/docker-compose.yml
              echo "Copied docker-compose.yml (fallback)"
            else
              echo "Error: docker-compose.yml.deploy not found!"
              exit 1
            fi
            
            if [ -f ~/nginx.conf.deploy ]; then
              cp ~/nginx.conf.deploy ~/noviai/nginx.conf
              echo "Copied nginx configuration"
            else
              echo "Error: nginx.conf.deploy not found!"
              exit 1
            fi
            
            # Create certbot directories for SSL certificates
            mkdir -p ~/noviai/certbot/conf
            mkdir -p ~/noviai/certbot/www
            
            # Load new backend image (if tar file exists)
            if [ -f ~/noviai-backend.tar.gz ]; then
              sudo docker load < ~/noviai-backend.tar.gz
              echo "Loaded backend image from tar"
            else
              echo "Warning: noviai-backend.tar.gz not found, docker compose will build if needed"
            fi
            
            # Stop and remove old containers
            cd ~/noviai
            
            # Stop and remove containers by name first (in case they were started differently)
            sudo docker stop noviai-backend noviai-nginx 2>/dev/null || true
            sleep 2
            sudo docker rm noviai-backend noviai-nginx 2>/dev/null || true
            
            # Use docker compose down to clean up networks (may fail if containers don't exist, that's ok)
            sudo docker compose down 2>/dev/null || true
            
            # Double check containers are gone
            sudo docker rm noviai-backend noviai-nginx 2>/dev/null || true
            
            # Start containers using docker compose
            sudo docker compose up -d
            
            # Verify containers started
            sleep 5
            if ! sudo docker ps | grep -q noviai-backend; then
              echo "Error: Backend container failed to start"
              sudo docker logs noviai-backend 2>/dev/null || echo "No backend logs available"
              exit 1
            fi
            
            if ! sudo docker ps | grep -q noviai-nginx; then
              echo "Error: Nginx container failed to start"
              sudo docker logs noviai-nginx 2>/dev/null || echo "No nginx logs available"
              sudo docker compose logs nginx 2>/dev/null || true
              exit 1
            fi
            
            # Wait for containers to start and be healthy
            echo "Waiting for containers to be healthy..."
            sleep 20
            
            # Check backend health endpoint (through nginx)
            for i in {1..10}; do
              if curl -f http://localhost/health > /dev/null 2>&1 || curl -f http://localhost:3001/health > /dev/null 2>&1; then
                echo "Health check passed!"
                break
              fi
              echo "Health check attempt $i failed, retrying in 5 seconds..."
              sleep 5
            done
            
            # Verify containers are running
            BACKEND_RUNNING=$(sudo docker ps | grep -q noviai-backend && echo "yes" || echo "no")
            NGINX_RUNNING=$(sudo docker ps | grep -q noviai-nginx && echo "yes" || echo "no")
            
            if [ "$BACKEND_RUNNING" = "yes" ] && [ "$NGINX_RUNNING" = "yes" ]; then
              echo "Deployment successful! Containers are running."
              
              # Show container status
              sudo docker ps | grep -E "(noviai-backend|noviai-nginx)"
              
              # Show health status
              echo "Backend health (via nginx):"
              curl -s http://localhost/health | jq '.' || curl -s http://localhost:3001/health | jq '.' || echo "Health endpoint response received"
              
              echo "Nginx health:"
              curl -s http://localhost/nginx-health || echo "Nginx health check"
              
              echo "Cleaning up old images and containers..."
              
              # Prune stopped containers
              sudo docker container prune -f
              
              # Prune dangling images
              sudo docker image prune -f
              
              # Prune unused images older than 24 hours
              sudo docker image prune -a -f --filter "until=24h"
              
              # Clean up tar file
              rm -f ~/noviai-backend.tar.gz
              
              echo "Cleanup completed successfully!"
            else
              echo "Deployment failed! One or more containers are not running."
              echo "Backend container status: $BACKEND_RUNNING"
              echo "Nginx container status: $NGINX_RUNNING"
              echo ""
              echo "Backend logs:"
              sudo docker logs noviai-backend || true
              echo ""
              echo "Nginx logs:"
              sudo docker logs noviai-nginx || true
              echo ""
              echo "All containers:"
              sudo docker ps -a
              exit 1
            fi
